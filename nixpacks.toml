[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo_mysql",
    "php82Extensions.bcmath",
    "php82Extensions.mbstring",
    "php82Packages.composer",
    "nodejs_20"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install",
    "npm run build"
]

[start]
cmd = "bash docker-entrypoint.sh"
